plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

// Setelah build release selesai, salin APK ke folder proyek dengan nama
// memakai versi dari pubspec.yaml (mis. kelasfun-v1.3.0-release.apk)
// supaya tidak tertukar dengan build lama.
def apkTargetName = "kelasfun-v${flutter.versionName}-release.apk"

// Signing config release dibaca dari android/key.properties (JANGAN
// dicommit berisi asli). Keystore .jks disimpan DI LUAR folder project.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.example.kelasfun"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId = "id.kelasfun.app"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        release {
            keyAlias = keystoreProperties['keyAlias']
            keyPassword = keystoreProperties['keyPassword']
            storeFile = keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword = keystoreProperties['storePassword']
        }
    }

    buildTypes {
        release {
            // Signed pakai keystore produksi (wajib sebelum jualan).
            signingConfig = signingConfigs.release
        }
    }
}

flutter {
    source = "../.."
}

tasks.whenTaskAdded { task ->
    if (task.name == "assembleRelease") {
        task.finalizedBy "copyReleaseApkToProjectRoot"
    }
}

tasks.register("copyReleaseApkToProjectRoot") {
    doLast {
        def src = layout.buildDirectory.file("outputs/flutter-apk/app-release.apk").get().asFile
        def dest = rootProject.file("../")
        copy {
            from src
            into dest
            rename { _ -> apkTargetName }
        }
        println "[OK] APK disalin ke: ${new File(dest, apkTargetName)}"
    }
}
