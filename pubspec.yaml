name: kelasfun
description: "Aplikasi manajemen kelas offline-first"
publish_to: 'none'
version: 1.4.0

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  drift: ^2.28.0
  path_provider: ^2.1.0
  path: ^1.9.0
  provider: ^6.1.0
  qr_flutter: ^4.1.0
  printing: ^5.12.0
  pdf: ^3.12.0
  intl: ^0.19.0
  file_picker: ^8.0.0
  image_picker: ^1.0.0
  mobile_scanner: ^5.2.3
  http: ^1.1.0
  shared_preferences: ^2.2.0
  shelf: ^1.4.2
  excel: ^4.0.6
  fl_chart: ^0.68.0
  google_fonts: ^6.3.0
  image: ^4.1.0
  qr: ^3.0.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  drift_dev: ">=2.22.0 <2.28.1"
  build_runner: ^2.4.0
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.0

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  windows:
    generate: true
    image_path: "assets/icon/app_icon.png"
    icon_size: 256
  min_sdk_android: 21
