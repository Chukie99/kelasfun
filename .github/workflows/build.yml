name: Build KelasFun

on:
  push:
    branches: [main, master, test-minimal]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: 'stable'
      
      - name: Get dependencies
        run: flutter pub get
      
      - name: Build APK
        run: flutter build apk --release 2>&1 || echo "::error::APK build failed"
      
      - name: Debug - Dump build errors
        if: failure()
        run: |
          echo "## Build Error Debug Info" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          flutter analyze --no-pub 2>&1 | head -100 >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "### File listing" >> $GITHUB_STEP_SUMMARY
          find lib/ -name "*.dart" | head -50 >> $GITHUB_STEP_SUMMARY
      
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kelasfun-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: 'stable'
      
      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop
      
      - name: Get dependencies
        run: flutter pub get
      
      - name: Build Windows EXE
        run: flutter build windows --release
      
      - name: Debug - Dump build errors
        if: failure()
        run: |
          echo "## Build Error Debug Info" >> $env:GITHUB_STEP_SUMMARY
          echo "Running flutter analyze..." >> $env:GITHUB_STEP_SUMMARY
          flutter analyze --no-pub 2>&1 | Out-String | Select-Object -First 100 >> $env:GITHUB_STEP_SUMMARY
      
      - name: Create ZIP
        if: success()
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath KelasFun-Windows.zip
      
      - name: Upload Windows
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kelasfun-windows
          path: KelasFun-Windows.zip
          if-no-files-found: error

  release:
    needs: [build-android, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      
      - name: Get version
        id: version
        run: |
          VERSION=$(grep "^version:" pubspec.yaml | awk '{print $2}' | sed 's/+.*//')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
      
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: kelasfun-apk
      
      - name: Download Windows
        uses: actions/download-artifact@v4
        with:
          name: kelasfun-windows
      
      - name: Rename files
        run: |
          VERSION=${{ steps.version.outputs.version }}
          mv app-release.apk KelasFun-v${VERSION}.apk
          mv KelasFun-Windows.zip KelasFun-Desktop-v${VERSION}.zip
      
      - name: Download HTML Generator
        run: cp tools/serial_generator.html .
      
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: KelasFun ${{ github.ref_name }}
          body: |
            ## KelasFun v${{ steps.version.outputs.version }}
            
            Aplikasi Manajemen Kelas Offline-First untuk Sekolah Indonesia
            
            ### Downloads
            - 📱 APK (Android)
            - 🖥️ Desktop (Windows)
            - 🔑 Serial Generator (buka di browser)
            
            ### Cara Aktivasi
            1. Buka app → copy Device ID
            2. Kirim ke seller via WhatsApp
            3. Seller generate kode di serial_generator.html
            4. Masukkan kode → selesai
          files: |
            KelasFun-v${{ steps.version.outputs.version }}.apk
            KelasFun-Desktop-v${{ steps.version.outputs.version }}.zip
            serial_generator.html
          generate_release_notes: true
