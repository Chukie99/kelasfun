name: Build KelasFun

on:
  push:
    branches: [main, master, test-minimal]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  debug-pubget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: 'stable'

      - name: Flutter info
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get 2>&1 | tee /tmp/pubget_output.txt || (echo "FAILED" && cat /tmp/pubget_output.txt && exit 1)

      - name: Dump pub get output on failure
        if: failure()
        run: |
          echo "=== PUB GET OUTPUT ===" >> $GITHUB_STEP_SUMMARY
          echo " " >> $GITHUB_STEP_SUMMARY
          echo "pre" >> $GITHUB_STEP_SUMMARY
          cat /tmp/pubget_output.txt >> $GITHUB_STEP_SUMMARY
          echo "/pre" >> $GITHUB_STEP_SUMMARY

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: 'stable'

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Get dependencies
        run: flutter pub get

      - name: Dump output on failure
        if: failure()
        shell: pwsh
        run: |
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "### pub get output"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "Check step logs for details"

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kelasfun-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
