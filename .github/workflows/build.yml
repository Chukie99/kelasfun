name: Build KelasFun

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
      
      - name: Get version from pubspec.yaml
        id: version
        run: |
          VERSION=$(grep "^version:" pubspec.yaml | awk '{print $2}' | sed 's/+.*//')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "📱 Version: $VERSION"
      
      - name: Get dependencies
        run: flutter pub get
      
      - name: Build APK
        run: flutter build apk --release
      
      - name: Rename APK with version
        run: mv build/app/outputs/flutter-apk/app-release.apk KelasFun-v${{ steps.version.outputs.version }}.apk
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kelasfun-apk-v${{ steps.version.outputs.version }}
          path: KelasFun-v${{ steps.version.outputs.version }}.apk
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
      
      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop
      
      - name: Get version from pubspec.yaml
        shell: bash
        run: |
          VERSION=$(grep "^version:" pubspec.yaml | awk '{print $2}' | sed 's/+.*//')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Desktop Version: $VERSION"
        id: version
      
      - name: Get dependencies
        run: flutter pub get
      
      - name: Build Windows EXE
        run: flutter build windows --release
      
      - name: Create ZIP with version
        run: |
          $VERSION = "${{ steps.version.outputs.version }}"
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath "KelasFun-Desktop-v${VERSION}.zip"
      
      - name: Upload Windows
        uses: actions/upload-artifact@v4
        with:
          name: kelasfun-desktop-v${{ steps.version.outputs.version }}
          path: KelasFun-Desktop-v${{ steps.version.outputs.version }}.zip
          if-no-files-found: error
