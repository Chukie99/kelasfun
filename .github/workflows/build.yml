name: Build KelasFun

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: 'stable'
      - run: flutter pub get
      - name: Build APK
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kelasfun-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 5

  build-windows:
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: 'stable'
      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
      - name: Build Windows
        run: flutter build windows --release
      - name: Create ZIP
        if: success()
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath KelasFun-Windows.zip
      - name: Upload Windows
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kelasfun-windows
          path: KelasFun-Windows.zip
          if-no-files-found: error
          retention-days: 5

  release:
    needs: [build-android]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - name: Get version
        id: version
        run: |
          VERSION=$(grep "^version:" pubspec.yaml | awk '{print $2}' | sed 's/+.*//')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
      - uses: actions/download-artifact@v4
        with:
          name: kelasfun-apk
          path: artifacts
      - name: Download Windows (if available)
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: kelasfun-windows
          path: artifacts
      - name: Prepare release files
        run: |
          VERSION=${{ steps.version.outputs.version }}
          find artifacts -name "*.apk" -exec mv {} "KelasFun-v${VERSION}.apk" \;
          cp tools/serial_generator.html .
          # Zip the HTML generator too
          zip serial_generator.zip serial_generator.html
          if [ -f "artifacts/KelasFun-Windows.zip" ]; then
            mv artifacts/KelasFun-Windows.zip "KelasFun-Desktop-v${VERSION}.zip"
          fi
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: KelasFun ${{ github.ref_name }}
          body: |
            ## KelasFun v${{ steps.version.outputs.version }}
            
            Aplikasi Manajemen Kelas Offline-First untuk Sekolah Indonesia
            
            ### Downloads
            - 📱 **APK** — Install di Android
            - 🖥️ **Desktop** — Windows EXE (jika tersedia)
            - 🔧 **Serial Generator** — Buka di browser untuk generate kode aktivasi
            
            ### Cara Aktivasi
            1. Buka app → copy Device ID
            2. Kirim ke seller via WhatsApp
            3. Seller buka `serial_generator.html` → paste Device ID → Generate
            4. Masukkan kode ke app → selesai!
          files: |
            KelasFun-v${{ steps.version.outputs.version }}.apk
            KelasFun-Desktop-v${{ steps.version.outputs.version }}.zip
            serial_generator.zip
          generate_release_notes: true
